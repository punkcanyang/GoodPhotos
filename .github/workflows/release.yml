name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build unsigned macOS release draft
        uses: tauri-apps/tauri-action@v0.6.0
        with:
          tagName: ${{ github.ref_name }}
          releaseName: GoodPhotos ${{ github.ref_name }}
          releaseBody: |
            > [!WARNING]
            > 此 macOS 版本没有加入 Apple Developer Program，因此没有 Apple 签名或 notarization。下载前请确认文件来自本 GitHub Release。应用内更新包仍使用 GoodPhotos updater 密钥进行加密签名与验证。
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          includeUpdaterJson: true
          args: --target aarch64-apple-darwin

      - name: Download draft assets for verification
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/goodphotos-release-assets"
          gh release download "${{ github.ref_name }}" \
            --dir "$RUNNER_TEMP/goodphotos-release-assets"

      - name: Verify unsigned release integrity
        run: |
          scripts/release/verify-unsigned-macos-release.sh \
            "$RUNNER_TEMP/goodphotos-release-assets" \
            "${{ github.ref_name }}"

      - name: Publish verified release
        run: gh release edit "${{ github.ref_name }}" --draft=false --prerelease=false
