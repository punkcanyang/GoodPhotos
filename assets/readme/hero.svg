<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">GoodPhotos：以多模態 AI 協助選片的桌面工作台</title>
  <desc id="desc">從一句選片意圖開始，經過審美標準顯化與多模態評估，最後輸出推薦照片、XMP 評分或 proofing gallery。</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b11"/>
      <stop offset="0.58" stop-color="#101521"/>
      <stop offset="1" stop-color="#141126"/>
    </linearGradient>
    <linearGradient id="cyanBlade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#54e5ff"/>
      <stop offset="1" stop-color="#2d8cff"/>
    </linearGradient>
    <linearGradient id="violetBlade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8e88ff"/>
      <stop offset="1" stop-color="#6254c5"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="0.28" stop-color="#4be4ff" stop-opacity="0.74"/>
      <stop offset="1" stop-color="#7b6dff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="microGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8fa5ca" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="30" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="418" rx="29" fill="none" stroke="#8fa5ca" stroke-opacity="0.22" stroke-width="2"/>
  <rect x="720" y="0" width="480" height="420" fill="url(#microGrid)" opacity="0.8"/>

  <g id="title-block" transform="translate(58 52)">
    <text x="0" y="0" fill="#6de7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" letter-spacing="2.2">LOCAL DESKTOP WORKBENCH · VLM IMAGE REVIEW</text>
    <text x="0" y="88" fill="#f4f7fb" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang TC, sans-serif" font-size="70" font-weight="800" letter-spacing="-2.5">GoodPhotos</text>
    <text x="2" y="143" fill="#d7dfef" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang TC, sans-serif" font-size="28" font-weight="650">讓 AI 讀懂你的選片意圖。</text>
    <text x="2" y="183" fill="#d7dfef" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="600">Turn a vague brief into a reviewable shortlist.</text>
    <text x="2" y="218" fill="#9aa8bd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">本機匯入 / LOCAL · 審美標準 / CRITERIA · 多模態評估 / REVIEW</text>

    <g transform="translate(0 250)">
      <rect width="150" height="42" rx="21" fill="#172b3c" stroke="#3fc9eb" stroke-opacity="0.7"/>
      <text x="75" y="27" text-anchor="middle" fill="#9beeff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">macOS-first</text>
      <rect x="166" width="104" height="42" rx="21" fill="#202044" stroke="#8e88ff" stroke-opacity="0.7"/>
      <text x="218" y="27" text-anchor="middle" fill="#c5c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">BYOK</text>
      <rect x="286" width="112" height="42" rx="21" fill="#171c28" stroke="#61708a" stroke-opacity="0.8"/>
      <text x="342" y="27" text-anchor="middle" fill="#bdc8da" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">v0.1.6</text>
    </g>

    <text x="2" y="344" fill="#77869d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">6 個評估維度 / 6 axes · 9 個預設 / 9 profiles · 11 providers</text>
  </g>

  <g id="aperture-proof" transform="translate(816 110)">
    <circle cx="104" cy="102" r="92" fill="none" stroke="#273446" stroke-width="13"/>
    <circle cx="104" cy="102" r="92" fill="none" stroke="#43d7fb" stroke-opacity="0.72" stroke-width="3" stroke-dasharray="32 19"/>
    <g transform="translate(104 102)">
      <polygon points="-25,-25 88,-39 56,58" fill="url(#cyanBlade)" opacity="0.82"/>
      <polygon points="-25,-25 88,-39 56,58" fill="url(#violetBlade)" opacity="0.75" transform="rotate(72)"/>
      <polygon points="-25,-25 88,-39 56,58" fill="url(#cyanBlade)" opacity="0.68" transform="rotate(144)"/>
      <polygon points="-25,-25 88,-39 56,58" fill="url(#violetBlade)" opacity="0.72" transform="rotate(216)"/>
      <polygon points="-25,-25 88,-39 56,58" fill="url(#cyanBlade)" opacity="0.7" transform="rotate(288)"/>
      <circle r="54" fill="url(#core)"/>
      <path d="M0-25Q0 0 25 0Q0 0 0 25Q0 0-25 0Q0 0 0-25Z" fill="#fff" opacity="0.9"/>
    </g>
  </g>

  <g id="workflow-proof" transform="translate(930 46)">
    <path d="M0 28C28 28 22 72 48 72H72" fill="none" stroke="#4adfff" stroke-width="2" stroke-opacity="0.7"/>
    <path d="M72 72C98 72 92 116 118 116H144" fill="none" stroke="#8d82ff" stroke-width="2" stroke-opacity="0.7"/>
    <path d="M144 116C170 116 164 160 190 160H214" fill="none" stroke="#4adfff" stroke-width="2" stroke-opacity="0.7"/>
    <circle cx="0" cy="28" r="6" fill="#54e5ff"/>
    <circle cx="72" cy="72" r="6" fill="#54e5ff"/>
    <circle cx="144" cy="116" r="6" fill="#8e88ff"/>
    <circle cx="214" cy="160" r="6" fill="#54e5ff"/>
  </g>

  <g id="pipeline" transform="translate(735 274)">
    <text x="0" y="0" fill="#74849c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="1.4">PIPELINE</text>
    <g transform="translate(0 22)">
      <rect width="84" height="67" rx="14" fill="#111d2a" stroke="#2d7f9e"/>
      <text x="14" y="25" fill="#59dcfa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">01</text>
      <text x="14" y="50" fill="#e6edf7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="650">INTENT</text>
      <path d="M94 34H106" stroke="#71829c" stroke-width="2"/>
      <path d="M102 29L108 34L102 39" fill="none" stroke="#71829c" stroke-width="2"/>
      <rect x="120" width="84" height="67" rx="14" fill="#17172b" stroke="#5953a3"/>
      <text x="134" y="25" fill="#a49fff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">02</text>
      <text x="134" y="50" fill="#e6edf7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="650">CRITERIA</text>
      <path d="M214 34H226" stroke="#71829c" stroke-width="2"/>
      <path d="M222 29L228 34L222 39" fill="none" stroke="#71829c" stroke-width="2"/>
      <rect x="240" width="84" height="67" rx="14" fill="#111d2a" stroke="#2d7f9e"/>
      <text x="254" y="25" fill="#59dcfa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">03</text>
      <text x="254" y="50" fill="#e6edf7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="650">REVIEW</text>
      <path d="M334 34H346" stroke="#71829c" stroke-width="2"/>
      <path d="M342 29L348 34L342 39" fill="none" stroke="#71829c" stroke-width="2"/>
      <rect x="360" width="84" height="67" rx="14" fill="#17172b" stroke="#5953a3"/>
      <text x="374" y="25" fill="#a49fff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">04</text>
      <text x="374" y="50" fill="#e6edf7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="650">OUTPUT</text>
    </g>
  </g>
</svg>
